# Sends the ePrint digest email every Monday.
#
# Needs, under Settings → Secrets and variables → Actions:
#   Variable  DIGEST_FILTER_CONFIG          the [filter] section of your config.toml
#   Secret    DIGEST_EMAIL_CONFIG           the [email] section of your config.toml
#   Secret    SMTP_PASSWORD                 the Gmail app password for [email] from
#   Secret    ANTHROPIC_API_KEY / OPENAI_API_KEY   (optional) key for the [llm] model's provider
#
# The config is split because variables are shown unmasked in run logs
# (including each step's env), and logs of public repos are public. Filters
# are fine to show and are easy to edit as a variable; email addresses are
# kept in a secret so they're masked.

name: Weekly ePrint digest

on:
  schedule:
    # Cron times are UTC: 12:00 UTC Monday = 7am EST / 8am EDT.
    # GitHub may start scheduled runs some minutes late.
    - cron: "0 12 * * 1"
  # Adds a "Run workflow" button on the Actions tab, for testing.
  workflow_dispatch:

# The job only needs to read the code.
permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config from variable + secret
        env:
          DIGEST_FILTER_CONFIG: ${{ vars.DIGEST_FILTER_CONFIG }}
          DIGEST_EMAIL_CONFIG: ${{ secrets.DIGEST_EMAIL_CONFIG }}
        run: |
          if [ -z "$DIGEST_EMAIL_CONFIG" ]; then
            echo "::error::The DIGEST_EMAIL_CONFIG secret is not set"
            exit 1
          fi
          # An unset filter variable just means "no filters": send everything.
          printf '%s\n\n%s\n' "$DIGEST_FILTER_CONFIG" "$DIGEST_EMAIL_CONFIG" \
            > "$RUNNER_TEMP/config.toml"

      - name: Fetch, filter, and send digest
        env:
          EPRINT_DIGEST_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Only the key for the provider in [llm] model is needed; unset ones are empty.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Start at 12:00 UTC seven days ago, not "exactly 7 days before now",
        # so a late start this week can't leave a gap after last week's run.
        run: |
          python main.py \
            --config "$RUNNER_TEMP/config.toml" \
            --since "$(date -u -d '7 days ago' +%Y-%m-%dT12:00:00)" \
            --send
